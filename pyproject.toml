[project]
name = "ir-playbooks"
version = "1.0.0"
description = "SOAR-Lite + Playbook Orchestrator for Mac local Security Incident Response"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ir-playbooks = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "playbooks*", "engine*"]